spring:
  config:
    activate:
      on-profile: openapi

  datasource:
    url: jdbc:h2:mem:openapi;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: openapi-client
            client-secret: openapi-secret
            scope:
              - read:user
              - user:email
            redirect-uri: http://localhost/login/oauth2/code/github

jwt:
  secret: b3BlbmFwaS10ZXN0LXNlY3JldC1vcGVuYXBpLXRlc3Qtc2VjcmV0LW9wZW5hcGktdGVzdC1zZWNyZXQtb3BlbmFwaS10ZXN0LXNlY3JldC0=
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

github:
  api:
    graphql-url: https://api.github.com/graphql
    tokens: openapi-token
    threshold: 100

app:
  cors:
    allowed-origins: http://localhost:3000
  oauth2:
    authorized-redirect-uri: http://localhost:3000/auth/callback
  cookie:
    domain: localhost
    secure: false
