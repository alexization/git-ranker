name: "🚀 Backend Feature Request"
description: API, 배치, 점수 계산, 인증, 데이터 처리 기능을 제안합니다.
title: "[Feature] "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        기능 요청은 "무엇을 만들고 싶은지"보다 "어떤 문제를 해결해야 하는지"가 먼저여야 합니다.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편, 누락, 운영 문제를 해결하려는지 적어 주세요.
      placeholder: 현재 랭킹 계산 결과가 오래된 상태로 유지되어 사용자 혼란이 발생합니다.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 기능이 추가되면 사용자나 운영자가 무엇을 할 수 있어야 하는지 적어 주세요.
      placeholder: 사용자가 수동 갱신을 요청하면 최신 집계 상태와 완료 시점을 확인할 수 있어야 합니다.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      options:
        - auth
        - ranking
        - user
        - badge
        - batch
        - integration/github
        - security
        - observability
        - infra/config
    validations:
      required: true

  - type: textarea
    id: desired_behavior
    attributes:
      label: 원하는 동작
      description: API, 배치, 계산, 에러 처리 관점에서 원하는 동작을 구체적으로 적어 주세요.
      placeholder: |
        - 어떤 입력을 받는지
        - 어떤 결과를 반환하는지
        - 실패 시 어떻게 동작하는지
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      description: 완료 판정이 가능한 체크리스트를 적어 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: contract_impact
    attributes:
      label: API / 스키마 / 배치 영향
      description: 엔드포인트, DTO, 이벤트, DB, 캐시, 스케줄러 영향이 있으면 적어 주세요.
      placeholder: |
        - API:
        - DTO/Schema:
        - DB/Migration:
        - Batch/Scheduler:
    validations:
      required: false

  - type: textarea
    id: qa_evidence
    attributes:
      label: 필요한 검증 증거
      description: 구현 후 어떤 테스트, 로그, 메트릭, trace 확인이 필요한지 적어 주세요.
      placeholder: |
        - `./gradlew test`
        - `./gradlew build -x test`
        - actuator/prometheus 확인
        - 관련 로그 확인
    validations:
      required: true

  - type: textarea
    id: non_goals_and_risks
    attributes:
      label: 비목표와 리스크
      placeholder: |
        비목표:
        리스크:
    validations:
      required: false

  - type: input
    id: related_client_issue
    attributes:
      label: 연관된 프론트엔드 이슈 또는 PR (선택)
      placeholder: "alexization/git-ranker-client#123"
    validations:
      required: false
