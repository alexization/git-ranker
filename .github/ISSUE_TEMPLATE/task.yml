name: "📋 작업 (Work Item)"
description: 기능·버그·리팩토링·간단한 수정 등 모든 백엔드 작업을 하나의 형식으로 기록합니다.
title: "[작업] "
labels: ["task", "triage"]
body:
  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      options:
        - feature
        - bug
        - refactor
        - chore
        - performance
        - security
        - observability
        - docs
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경 / 문제
      description: 이 작업이 필요한 이유. 버그면 증상, 기능이면 필요, 리팩토링이면 현재 구조의 문제.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 작업 내용 / 기대 결과
      description: 무엇을 해야 하는지와 완료 후 기대 동작.
    validations:
      required: true
  - type: textarea
    id: bug_detail
    attributes:
      label: 재현 절차 / 기대 vs 실제 (버그인 경우)
      placeholder: |
        재현: 1) ... 2) ...
        기대: ...
        실제: ...
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      placeholder: |
        - `domain/ranking`
        - `global/logging`
        - `src/test/...`
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
      placeholder: |
        - `./gradlew test`
        - `./gradlew build -x test`
        - 로그/메트릭 확인
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 리스크 / 의존성 / 연관
      placeholder: |
        - 리스크:
        - 의존성(상대 레포 이슈):
        - 상위 추적:
    validations:
      required: false
