name: "🐞 Backend Bug Report"
description: API, 인증, 배치, 점수 계산, 데이터 정합성 관련 문제를 제보합니다.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 정보와 로그를 남겨 주세요.
        백엔드 이슈는 "어떤 요청/배치/계산 경로에서 깨졌는지"가 중요합니다.

  - type: textarea
    id: problem
    attributes:
      label: 문제 요약
      description: 무엇이 잘못되었는지 한두 문장으로 설명해 주세요.
      placeholder: GitHub 로그인 후 access token 재발급이 실패합니다.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      options:
        - auth
        - ranking
        - user
        - badge
        - batch
        - integration/github
        - security
        - observability
        - infra/config
        - unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 요청 순서, 입력값, API 경로, 배치 실행 조건을 순서대로 적어 주세요.
      placeholder: |
        1. `/api/v1/auth/refresh` 호출
        2. 만료된 refresh token 쿠키 포함
        3. 500 응답 발생
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 기대 동작
      placeholder: 401 또는 정상적인 토큰 재발급 응답이 와야 합니다.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 실제 동작
      placeholder: 응답 본문 없이 500이 발생하고 서버 로그에 JWT 파싱 예외가 남습니다.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 로그 / 메트릭 / 트레이스 / 스크린샷
      description: 서버 로그, actuator 정보, trace id, 클라이언트 콘솔, 스크린샷 등 증거를 남겨 주세요.
      placeholder: |
        - trace_id:
        - log excerpt:
        - metric/query:
        - screenshot/link:
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 영향도와 범위
      description: 사용자 영향, 데이터 손상 가능성, 우회 가능 여부를 적어 주세요.
      placeholder: |
        - 영향 사용자:
        - 데이터 영향:
        - 우회 방법:
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 수정 후 확인해야 할 조건
      placeholder: |
        - 만료 토큰 요청 시 401을 반환한다.
        - 정상 토큰 요청 시 재발급이 성공한다.
        - 관련 에러 로그가 더 이상 발생하지 않는다.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      placeholder: |
        - profile: local / dev / prod
        - branch or commit:
        - DB:
        - 요청 클라이언트:
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 확인 사항
      options:
        - label: 이 이슈와 동일한 기존 이슈가 있는지 검색해 보았습니다.
          required: true
        - label: 재현 절차 또는 로그 등 디버깅 가능한 증거를 남겼습니다.
          required: true

